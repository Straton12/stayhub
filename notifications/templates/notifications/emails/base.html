<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block email_title %}StayHub{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#f5f7fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#0f172a;">

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f5f7fb; padding:32px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,0.06);">

          <!-- Brand bar -->
          <tr>
            <td style="padding:22px 26px; background:linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #22d3ee 100%); color:#ffffff;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="vertical-align:middle;">
                    <span style="display:inline-block; font-size:18px; font-weight:800; letter-spacing:-0.3px; color:#ffffff;">
                      StayHub
                    </span>
                  </td>
                  <td align="right" style="vertical-align:middle; font-size:12px; color:rgba(255,255,255,0.85);">
                    {% block email_kicker %}Notification{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 26px; font-size:14px; line-height:1.65; color:#334155;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:18px 26px 22px; background:#f8fafc; border-top:1px solid #eef1f8; font-size:12px; color:#94a3b8; line-height:1.6;">
              This email was sent by StayHub because you have an account with us.
              If you didn't expect it, you can safely ignore it.
            </td>
          </tr>

        </table>

        <div style="margin-top:14px; font-size:11.5px; color:#94a3b8;">
          © StayHub · Built for East Africa
        </div>

      </td>
    </tr>
  </table>

</body>
</html>
