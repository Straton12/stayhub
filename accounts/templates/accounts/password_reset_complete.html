<!DOCTYPE html>
<html><head><title>Password updated — StayHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; margin: 0; }
  .card { background: #fff; max-width: 420px; width: 100%; padding: 32px;
          border-radius: 16px; box-shadow: 0 20px 60px rgba(15,23,42,0.12); text-align: center; }
  .icon { width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 16px;
          background: #ecfdf5; color: #047857; display: grid; place-items: center;
          font-size: 26px; }
  h1 { font-size: 20px; color: #0f172a; margin-bottom: 8px; }
  p  { font-size: 13.5px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 10px; color: #fff;
          background: linear-gradient(135deg, #6366f1, #8b5cf6);
          box-shadow: 0 10px 24px rgba(99,102,241,0.35);
          text-decoration: none; font-weight: 700; font-size: 14px; }
  a.btn:hover { filter: brightness(1.05); }
</style></head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Password updated</h1>
    <p>Your password has been changed. You can now sign in with your new credentials.</p>
    <a href="{% url 'login' %}" class="btn">Sign in</a>
  </div>
</body></html>
