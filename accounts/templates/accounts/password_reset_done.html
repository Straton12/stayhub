<!DOCTYPE html>
<html><head><title>Check your email — StayHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; margin: 0; }
  .card { background: #fff; max-width: 420px; width: 100%; padding: 32px;
          border-radius: 16px; box-shadow: 0 20px 60px rgba(15,23,42,0.12); text-align: center; }
  .icon { width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 16px;
          background: #eef2ff; color: #4f46e5; display: grid; place-items: center;
          font-size: 26px; }
  h1 { font-size: 20px; color: #0f172a; margin-bottom: 8px; }
  p  { font-size: 13.5px; color: #64748b; line-height: 1.6; margin-bottom: 18px; }
  a  { color: #6366f1; text-decoration: none; font-weight: 600; font-size: 13px; }
  a:hover { text-decoration: underline; }
</style></head>
<body>
  <div class="card">
    <div class="icon">📧</div>
    <h1>Check your email</h1>
    <p>If an account exists for that email, we've sent a reset link. It should arrive within a minute or two.</p>
    <a href="{% url 'login' %}">← Back to sign in</a>
  </div>
</body></html>
