<!DOCTYPE html>
<html><head><title>Reset password — StayHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
  .card { background: #fff; max-width: 420px; width: 100%; padding: 32px;
          border-radius: 16px; box-shadow: 0 20px 60px rgba(15,23,42,0.12); }
  h1 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
  p  { font-size: 13.5px; color: #64748b; margin-bottom: 20px; line-height: 1.6; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
          font-weight: 600; color: #334155; margin-bottom: 6px; }
  input[type="email"] { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px;
          font-size: 14px; background: #f8fafc; margin-bottom: 16px; box-sizing: border-box; }
  input[type="email"]:focus { outline: none; border-color: #6366f1; background: #fff;
          box-shadow: 0 0 0 4px rgba(99,102,241,0.15); }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
           font-size: 14px; font-weight: 600; color: #fff;
           background: linear-gradient(135deg, #6366f1, #8b5cf6);
           box-shadow: 0 10px 24px rgba(99,102,241,0.35); }
  button:hover { filter: brightness(1.05); }
  a.back { display: inline-block; margin-top: 18px; font-size: 13px; color: #6366f1;
           text-decoration: none; font-weight: 600; }
  a.back:hover { text-decoration: underline; }
</style></head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p>Enter the email you signed up with, and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      <label for="id_email">Email</label>
      <input type="email" name="email" id="id_email" required placeholder="you@example.com">
      <button type="submit">Send reset link</button>
    </form>
    <a href="{% url 'login' %}" class="back">← Back to sign in</a>
  </div>
</body></html>
